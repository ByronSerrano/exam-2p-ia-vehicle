version: '3.8'
services:
  vehicle-recognition:
    image: nvidia/cuda:11.8.0-cudnn8-devel-ubuntu20.04
    container_name: vehicle-recognition
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - .:/app
    working_dir: /app
    command: ["bash", "-c", "pip install -r requirements.txt && python main.py"]
    ports:
      - "8888:8888"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
